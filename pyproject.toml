[project]
name = "fedact"
version = "0.1.0"
description = "FedACT: Federated Action-Certified Threat Dynamics"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fedact*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "."]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-n auto"

[dependency-groups]
dev = [
    "nox>=2026.8.10",
    "vulture>=2.14",
    "deptry>=0.23",
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
    "pyright>=1.1",
    "types-pyyaml>=6.0",
]
[tool.deptry]
known_first_party = ["fedact"]

[tool.deptry.per_rule_ignores]
DEP004 = ["nox"]
DEP002 = ["types-pyyaml"]
