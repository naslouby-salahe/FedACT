[project]
name = "fedact"
version = "0.1.0"
description = "FedACT: Federated Action-Certified Threat Dynamics"
requires-python = ">=3.12"
dependencies = [
    "cvxpy>=1.9.2",
    "ecos>=2.0.14",
    "numpy>=1.26",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "scipy>=1.18.1",
    "torch>=2.3",
    "typer>=0.12",
]

[project.scripts]
fedact = "fedact.cli.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fedact*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "."]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib -n auto"

[dependency-groups]
dev = [
    "nox>=2026.8.10",
    "vulture>=2.14",
    "deptry>=0.23",
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
    "pyright>=1.1",
    "types-pyyaml>=6.0",
    "import-linter>=2.13",
    "pytest-cov>=7.1.0",
]

[tool.deptry]
known_first_party = ["fedact"]

[tool.deptry.per_rule_ignores]
DEP004 = ["nox"]
DEP002 = ["types-pyyaml", "torch", "cvxpy", "ecos", "scipy", "pandas", "pyarrow"]

[tool.ruff.lint.per-file-ignores]
"src/fedact/cli/main.py" = ["UP045"]

[tool.importlinter]
root_packages = ["fedact"]

[[tool.importlinter.contracts]]
name = "Domain is independent of implementation packages"
type = "forbidden"
source_modules = ["fedact.domain"]
forbidden_modules = [
    "fedact.config",
    "fedact.datasets",
    "fedact.models",
    "fedact.training",
    "fedact.operators",
    "fedact.fedact",
    "fedact.scoring",
    "fedact.artifacts",
    "fedact.baselines",
    "fedact.calibration",
    "fedact.evaluation",
    "fedact.analysis",
    "fedact.reporting",
    "fedact.runtime",
    "fedact.experiments",
    "fedact.app",
    "fedact.cli",
]

[[tool.importlinter.contracts]]
name = "Configuration depends only inward on domain"
type = "forbidden"
source_modules = ["fedact.config"]
forbidden_modules = [
    "fedact.datasets",
    "fedact.models",
    "fedact.training",
    "fedact.operators",
    "fedact.fedact",
    "fedact.scoring",
    "fedact.artifacts",
    "fedact.baselines",
    "fedact.calibration",
    "fedact.evaluation",
    "fedact.analysis",
    "fedact.reporting",
    "fedact.runtime",
    "fedact.experiments",
    "fedact.app",
    "fedact.cli",
]

[[tool.importlinter.contracts]]
name = "Lower layers never depend on orchestration surfaces"
type = "forbidden"
source_modules = [
    "fedact.domain",
    "fedact.config",
    "fedact.datasets",
    "fedact.models",
    "fedact.training",
    "fedact.operators",
    "fedact.fedact",
    "fedact.scoring",
    "fedact.artifacts",
    "fedact.baselines",
    "fedact.calibration",
    "fedact.evaluation",
    "fedact.analysis",
]
forbidden_modules = [
    "fedact.reporting",
    "fedact.runtime",
    "fedact.experiments",
    "fedact.app",
    "fedact.cli",
]

[[tool.importlinter.contracts]]
name = "Peer infrastructure packages remain independent"
type = "independence"
modules = [
    "fedact.datasets",
    "fedact.models",
    "fedact.operators",
    "fedact.artifacts",
]

[tool.coverage.run]
source = ["src/fedact"]

[tool.coverage.report]
fail_under = 85
show_missing = true
